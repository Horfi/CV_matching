version: '3.8'

services:
  # 1. Edge Gateway / BFF (The Ambassador)
  bff-gateway:
    build: ./bff-gateway
    container_name: cv_bff_gateway
    ports:
      - "8000:8000"
    volumes:
      - ./bff-gateway:/code
    environment:
      - ORCHESTRATION_URL=http://orchestration-engine:8001
    depends_on:
      - orchestration-engine

  # 2. Orchestration Engine (The Control Plane)
  orchestration-engine:
    build: ./orchestration-engine
    container_name: cv_orchestrator
    ports:
      - "8001:8001"
    volumes:
      - ./orchestration-engine:/code
    environment:
      - REDIS_URL=redis://message-broker:6379/0
      - DATABASE_URL=postgresql://user:password@state-vault:5432/cv_state
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      state-vault:
        condition: service_healthy
      message-broker:
        condition: service_started

  # 3. Message Broker (The Nervous System)
  message-broker:
    image: redis:alpine
    container_name: cv_redis
    ports:
      - "6379:6379"

  # 4. Async Data Worker (I/O Processor)
  worker-data-io:
    build: ./worker-data-io
    container_name: cv_worker_data
    volumes:
      - ./worker-data-io:/code
    environment:
      - REDIS_URL=redis://message-broker:6379/0
      - QDRANT_URL=http://vector-store:6333
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - message-broker
      - vector-store
    command: celery -A tasks_api worker --concurrency=20 -l info

  # 5. Autonomous Browser Worker (The Execution Plane / Playwright)
  worker-browser-heavy:
    build: ./worker-browser-heavy
    container_name: cv_worker_browser
    volumes:
      - ./worker-browser-heavy:/code
    environment:
      - REDIS_URL=redis://message-broker:6379/0
      - API_WEBHOOK_URL=http://orchestration-engine:8001/webhook/resume
    depends_on:
      - message-broker
      - orchestration-engine
    # The Death Pact config: 1 process, recycle after 10 tasks to clear memory leaks
    command: celery -A tasks_browser worker -P solo --max-tasks-per-child=10 -l info

  # 6. Relational State Vault (Durable Memory / HITL Checkpoints)
  state-vault:
    image: postgres:15-alpine
    container_name: cv_postgres_state
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cv_state
    ports:
      - "5432:5432"
    volumes:
      - pg_state_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d cv_state"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 7. Semantic Vector Store (Matchmaker Core)
  vector-store:
    image: qdrant/qdrant:latest
    container_name: cv_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Presentation Layer (Next.js)
  frontend-ui:
    build: ./frontend-ui
    container_name: cv_frontend_ui
    volumes:
      - ./frontend-ui:/app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000 # Points to BFF Gateway

  # Test Runner (integration-style tests inside compose network)
  test-runner:
    image: python:3.11-slim
    container_name: cv_test_runner
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      bff-gateway:
        condition: service_started
      orchestration-engine:
        condition: service_started
      message-broker:
        condition: service_started
      state-vault:
        condition: service_healthy
      vector-store:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
    command: bash -c "pip install -r requirements-test.txt && python scripts/wait_for_services.py && pytest -v tests"
    restart: 'no'

volumes:
  pg_state_data:
  qdrant_data: